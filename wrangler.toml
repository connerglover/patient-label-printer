# Cloudflare Workers Static Assets configuration.
#
# The build pipeline runs `npx wrangler deploy`, which reads this file and
# uploads `dist/` as a static asset bundle — no Worker script needed, since
# nothing here runs server-side. Local equivalents: `npm run deploy` to publish,
# `npm run preview:cf` to serve the build through Cloudflare's own runtime.

name = "patient-label-printer"
compatibility_date = "2026-08-23"

[assets]
directory = "./dist"

# Single route, no client-side router: unknown paths should 404 for real rather
# than soft-200 to index.html, which would otherwise let search engines index
# every typo'd URL as a copy of the homepage.
not_found_handling = "none"
