<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenwayXLS2Label</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="icon.ico">
    <link rel="apple-touch-icon" href="icon.ico">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>GreenwayXLS2Label</h1>
            <p>Convert patient data from Excel files to printable PDF labels</p>
        </header>

        <main>
            <!-- File Upload Section -->
            <section class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📄</div>
                    <p>Drag and drop your Excel file here or <button id="fileButton" class="link-button">click to browse</button></p>
                    <small>Supports .xls and .xlsx files</small>
                    <input type="file" id="fileInput" accept=".xls,.xlsx" hidden>
                </div>
                <div id="fileInfo" class="file-info hidden"></div>
            </section>

            <!-- Messages -->
            <div id="messages" class="messages"></div>

            <!-- Configuration Panel -->
            <section id="configSection" class="config-section hidden">
                <h3>Label Configuration</h3>
                <div class="config-grid">
                    <div class="config-item">
                        <label for="labelsPerPatient">Labels per Patient:</label>
                        <input type="number" id="labelsPerPatient" min="1" max="10" value="2">
                    </div>
                    <div class="config-item">
                        <label for="filename">Output Filename:</label>
                        <input type="text" id="filename" value="Patient_Labels.pdf">
                    </div>
                    <div class="config-item">
                        <label for="labelWidth">Width (inches):</label>
                        <input type="number" id="labelWidth" min="0.5" max="8.5" step="0.125" value="1.125">
                    </div>
                    <div class="config-item">
                        <label for="labelHeight">Height (inches):</label>
                        <input type="number" id="labelHeight" min="0.5" max="11" step="0.125" value="3.5">
                    </div>
                    <div class="config-item">
                        <label for="fontSize">Font Size:</label>
                        <input type="number" id="fontSize" min="6" max="24" value="10">
                    </div>
                    <div class="config-item">
                        <label for="fontFamily">Font Family:</label>
                        <select id="fontFamily">
                            <option value="helvetica">Helvetica</option>
                            <option value="times">Times</option>
                            <option value="courier">Courier</option>
                        </select>
                    </div>
                </div>
                
                <!-- Preview -->
                <div class="preview-section">
                    <h4>Preview</h4>
                    <div id="labelPreview" class="label-preview">
                        <div class="sample-label">
                            <div>Name: Sample Patient</div>
                            <div>ID: 12345</div>
                            <div>DOB: 01/01/1990</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Patient List -->
            <section id="patientSection" class="patient-section hidden">
                <div class="section-header">
                    <h3>Patient List (<span id="patientCount">0</span> patients)</h3>
                    <div class="header-actions">
                        <button id="selectAllBtn" class="btn-secondary">Select All</button>
                        <button id="removeSelectedBtn" class="btn-danger hidden">Remove Selected</button>
                    </div>
                </div>
                <div id="patientList" class="patient-list"></div>
            </section>

            <!-- Action Buttons -->
            <section id="actionSection" class="action-section hidden">
                <button id="printBtn" class="btn-primary">
                    <span id="printText">Print PDF Labels</span>
                    <span id="printSpinner" class="spinner hidden">⏳</span>
                </button>
                <button id="clearBtn" class="btn-secondary">Clear All</button>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
