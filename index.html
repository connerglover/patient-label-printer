<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PatientLabelPrinter — Print Patient ID Labels from a Greenway EMR Export</title>
    <meta
      name="description"
      content="Free browser tool that turns the Greenway EMR daily summary report (.xls/.xlsx) into a print-ready PDF of patient ID labels with name, MRN and date of birth. Built for Greenway's report layout only — other EMRs are not supported. No upload, no account."
    />
    <meta
      name="keywords"
      content="greenway emr labels, greenway patient labels, greenway daily summary report, greenway label printing, patient label printer, patient id labels, chart labels, specimen labels, MRN labels"
    />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f9fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b2127" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PatientLabelPrinter" />
    <meta property="og:title" content="PatientLabelPrinter — Print Patient ID Labels from a Greenway EMR Export" />
    <meta
      property="og:description"
      content="Turn the Greenway EMR daily summary report into a print-ready PDF of patient ID labels. Greenway only. Runs entirely in your browser — no upload, no account."
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta name="twitter:card" content="summary" />

    <script src="/theme-init.js"></script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PatientLabelPrinter",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Any (web browser)",
        "description": "Turns the Greenway EMR daily summary report into a print-ready PDF of patient ID labels showing name, medical record number and date of birth. It reads Greenway's daily summary layout specifically and does not support exports from other EMRs. Parsing and PDF generation happen entirely in the browser.",
        "browserRequirements": "Requires JavaScript",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Reads the Greenway EMR daily summary report (.xls and .xlsx)",
          "Extracts patient name, MRN and date of birth",
          "Configurable label stock sizes and copies per patient",
          "Client-side only — no patient data is uploaded"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font: 16px system-ui; padding: 2rem; text-align: center">
        PatientLabelPrinter needs JavaScript — the Greenway daily summary report is parsed and the
        PDF is built in your browser, so there is no server to fall back on.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
